    <meta charset="UTF-8" />
    <script>
      // Ensure window.fetch has both getter and setter so injected scripts/polyfills don't throw
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore if already configurable
        }
      })();
    </script>
